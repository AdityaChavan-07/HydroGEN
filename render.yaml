services:
  - type: web
    name: research-papers
    runtime: python
    plan: starter            # persistent disks require a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/auth/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: STORAGE_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # you'll be prompted for this in the dashboard (min 12 chars)
    disk:
      name: papers-data
      mountPath: /var/data
      sizeGB: 1
